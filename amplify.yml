# AWS Amplify Hosting build spec for the customer-facing page
# (frontend/index.html). No build tooling — the only "build" step is writing
# config.js, which is what tells the page where to send a call.
#
# frontend/make_config.py does that from .env for local runs; .env never
# reaches Amplify, so here the same file is generated from an Amplify
# environment variable instead. Set it in the Amplify console under
# App settings -> Environment variables:
#
#   CALL_ENDPOINT = https://<your-presign-lambda-url>/    (or wss://<...>)
#
# The portal (agentcore_app/portal.html) is deliberately NOT deployed here —
# it addresses its backend on same-origin paths (/portal/api/..., /portal/ws/...)
# and reads live per-call state that only the agent process holds, so on a
# static host it has nothing to talk to. It stays served by the agent itself.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Fail the build here rather than shipping a page whose call button is
        # dead: without this value index.html disables calling entirely.
        - |
          if [ -z "$CALL_ENDPOINT" ]; then
            echo "CALL_ENDPOINT is not set — add it under App settings > Environment variables"
            exit 1
          fi
        # An Amplify page is served over HTTPS, and a secure page cannot open a
        # ws:// socket or fetch http:// — the browser blocks it as mixed
        # content, with the call silently failing to connect. Catch the
        # localhost/ws:// endpoint that works locally but never in the cloud.
        - |
          case "$CALL_ENDPOINT" in
            https://*|wss://*) ;;
            *) echo "CALL_ENDPOINT must be https:// or wss:// for a hosted page (got: $CALL_ENDPOINT)"
               exit 1 ;;
          esac
    build:
      commands:
        - mkdir -p dist
        - cp frontend/index.html dist/index.html
        # Written with python's json.dumps, not printf: the value lands inside
        # a JS source file, so quotes and backslashes have to be escaped.
        - |
          python3 -c 'import json,os; open("dist/config.js","w").write(
            "// Generated by amplify.yml from the CALL_ENDPOINT env var.\n"
            "window.AVA_CONFIG = { callEndpoint: %s };\n" % json.dumps(os.environ["CALL_ENDPOINT"]))'
        - echo "built dist/ with CALL_ENDPOINT=$CALL_ENDPOINT" && ls -l dist
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths: []
