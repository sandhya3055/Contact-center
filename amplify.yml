# AWS Amplify Hosting build spec for the customer-facing page
# (frontend/index.html). No build tooling — the only "build" step is writing
# config.js, which is what tells the page where to send a call.
#
# frontend/make_config.py does that from .env for local runs; .env never
# reaches Amplify, so here the same file is generated from an Amplify
# environment variable instead. Set it in the Amplify console under
# App settings -> Environment variables:
#
#   CALL_ENDPOINT = https://<your-presign-lambda-url>/    (or wss://<...>)
#
# The agent portal (agentcore_app/portal.html) ships too, but only if you set
#
#   PORTAL_API_BASE = https://<your-agent-origin>
#
# It has no data of its own: the transcript, the escalation and the audio
# bridge all live in the agent process, so the page needs that origin to call.
# Leave PORTAL_API_BASE unset and the portal is skipped, which is the right
# choice if the agent serves it itself (GET /portal).
#
# Deploying it here needs two things on the agent side:
#   PORTAL_ALLOWED_ORIGINS = https://<this-amplify-domain>   (CORS + WS origin check)
#   PORTAL_BASE_URL        = https://<this-amplify-domain>   (so Slack links point here)
# The agent must also be reachable from a browser over https/wss.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Fail the build here rather than shipping a page whose call button is
        # dead: without this value index.html disables calling entirely.
        - |
          if [ -z "$CALL_ENDPOINT" ]; then
            echo "CALL_ENDPOINT is not set — add it under App settings > Environment variables"
            exit 1
          fi
        # An Amplify page is served over HTTPS, and a secure page cannot open a
        # ws:// socket or fetch http:// — the browser blocks it as mixed
        # content, with the call silently failing to connect. Catch the
        # localhost/ws:// endpoint that works locally but never in the cloud.
        - |
          case "$CALL_ENDPOINT" in
            https://*|wss://*) ;;
            *) echo "CALL_ENDPOINT must be https:// or wss:// for a hosted page (got: $CALL_ENDPOINT)"
               exit 1 ;;
          esac
    build:
      commands:
        - mkdir -p dist
        - cp frontend/index.html dist/index.html
        # Written with python's json.dumps, not printf: the value lands inside
        # a JS source file, so quotes and backslashes have to be escaped.
        - |
          python3 -c 'import json,os; open("dist/config.js","w").write(
            "// Generated by amplify.yml from the CALL_ENDPOINT env var.\n"
            "window.AVA_CONFIG = { callEndpoint: %s };\n" % json.dumps(os.environ["CALL_ENDPOINT"]))'
        # The portal, when PORTAL_API_BASE says where the agent is. Written as
        # dist/portal/index.html rather than dist/portal.html so the URL
        # /portal — the path the Slack link already builds — resolves with no
        # Amplify rewrite rule to maintain.
        - |
          if [ -n "$PORTAL_API_BASE" ]; then
            case "$PORTAL_API_BASE" in
              https://*) ;;
              *) echo "PORTAL_API_BASE must be https:// (got: $PORTAL_API_BASE)"; exit 1 ;;
            esac
            mkdir -p dist/portal
            cp agentcore_app/portal.html dist/portal/index.html
            python3 -c 'import json,os; open("dist/portal/config.js","w").write(
              "// Generated by amplify.yml from the PORTAL_API_BASE env var.\n"
              "window.AVA_PORTAL_CONFIG = { apiBase: %s };\n" % json.dumps(os.environ["PORTAL_API_BASE"]))'
            echo "portal built against $PORTAL_API_BASE"
          else
            echo "PORTAL_API_BASE unset — skipping the portal (the agent serves it at /portal)"
          fi
        - echo "built dist/ with CALL_ENDPOINT=$CALL_ENDPOINT" && find dist -type f
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths: []
