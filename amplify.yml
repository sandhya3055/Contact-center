# AWS Amplify Hosting build spec for the customer-facing page
# (frontend/index.html). No build tooling — the only "build" step is writing
# config.js, which is what tells the page where to send a call.
#
# frontend/make_config.py does that from .env for local runs; .env never
# reaches Amplify, so here the same file is generated from an Amplify
# environment variable instead. Set it in the Amplify console under
# App settings -> Environment variables:
#
#   CALL_ENDPOINT = https://<your-presign-lambda-url>/    (or wss://<...>)
#
# The agent portal (agentcore_app/portal.html) ships too, if you set either of
# these — it needs at least one source of data, and they are different sources:
#
#   PORTAL_CONTEXT_URL = https://<portal-context-lambda-url>
#       The escalation reason, the queue row and the conversation, read from
#       DynamoDB and AgentCore Memory by lambda/portal_context_handler.py. No
#       agent container involved, so this works for a call that has ended and
#       for an agent with no browser-reachable origin — which is the case
#       behind AgentCore Runtime, where the only way in is a signed WebSocket.
#
#   PORTAL_API_BASE = https://<your-agent-origin>
#       Live call state and the audio bridge, i.e. the Join button. Must be the
#       origin of the strands_agent.py process itself: the one serving /ws,
#       /portal and /portal/api/... A presign API Gateway is NOT this — it
#       answers every path with a signed URL, which the portal now detects and
#       reports rather than rendering an empty call.
#
# Set both for the full portal. With only PORTAL_CONTEXT_URL the page is a
# read-only record of the call and says so. Set neither and the portal is
# skipped, which is right if the agent serves it itself at GET /portal.
#
# PORTAL_API_BASE also needs two things on the agent side, since the page is
# then on a different origin from the API it calls:
#   PORTAL_ALLOWED_ORIGINS = https://<this-amplify-domain>   (CORS + WS origin check)
#   PORTAL_BASE_URL        = https://<this-amplify-domain>   (so Slack links point here)
version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Fail the build here rather than shipping a page whose call button is
        # dead: without this value index.html disables calling entirely.
        - |
          if [ -z "$CALL_ENDPOINT" ]; then
            echo "CALL_ENDPOINT is not set — add it under App settings > Environment variables"
            exit 1
          fi
        # An Amplify page is served over HTTPS, and a secure page cannot open a
        # ws:// socket or fetch http:// — the browser blocks it as mixed
        # content, with the call silently failing to connect. Catch the
        # localhost/ws:// endpoint that works locally but never in the cloud.
        - |
          case "$CALL_ENDPOINT" in
            https://*|wss://*) ;;
            *) echo "CALL_ENDPOINT must be https:// or wss:// for a hosted page (got: $CALL_ENDPOINT)"
               exit 1 ;;
          esac
    build:
      commands:
        - mkdir -p dist
        - cp frontend/index.html dist/index.html
        # Written with python's json.dumps, not printf: the value lands inside
        # a JS source file, so quotes and backslashes have to be escaped.
        - |
          python3 -c 'import json,os; open("dist/config.js","w").write(
            "// Generated by amplify.yml from the CALL_ENDPOINT env var.\n"
            "window.AVA_CONFIG = { callEndpoint: %s };\n" % json.dumps(os.environ["CALL_ENDPOINT"]))'
        # The portal, when either source is configured. Written as
        # dist/portal/index.html rather than dist/portal.html so the URL
        # /portal — the path the Slack link already builds — resolves with no
        # Amplify rewrite rule to maintain.
        - |
          if [ -n "$PORTAL_API_BASE" ] || [ -n "$PORTAL_CONTEXT_URL" ]; then
            # Same mixed-content trap as CALL_ENDPOINT: this page is served
            # over HTTPS and cannot fetch http:// or open ws://.
            for pair in "PORTAL_API_BASE=$PORTAL_API_BASE" "PORTAL_CONTEXT_URL=$PORTAL_CONTEXT_URL"; do
              value="${pair#*=}"
              case "$value" in
                ""|https://*) ;;
                *) echo "${pair%%=*} must be https:// (got: $value)"; exit 1 ;;
              esac
            done
            mkdir -p dist/portal
            cp agentcore_app/portal.html dist/portal/index.html
            # Both keys are always written, empty when unset: the page treats
            # the existence of this file as "hosted off the agent", and an
            # absent apiBase as "records only" rather than "try same-origin",
            # which would fetch this static host and report the agent as down.
            python3 -c 'import json,os; open("dist/portal/config.js","w").write(
              "// Generated by amplify.yml from PORTAL_API_BASE / PORTAL_CONTEXT_URL.\n"
              "window.AVA_PORTAL_CONFIG = { apiBase: %s, contextUrl: %s };\n" % (
                json.dumps(os.environ.get("PORTAL_API_BASE", "")),
                json.dumps(os.environ.get("PORTAL_CONTEXT_URL", ""))))'
            echo "portal built — live: ${PORTAL_API_BASE:-(none)}, records: ${PORTAL_CONTEXT_URL:-(none)}"
          else
            echo "PORTAL_API_BASE and PORTAL_CONTEXT_URL both unset — skipping the portal"
            echo "(the agent serves it at GET /portal on its own origin)"
          fi
        - echo "built dist/ with CALL_ENDPOINT=$CALL_ENDPOINT" && find dist -type f
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths: []
