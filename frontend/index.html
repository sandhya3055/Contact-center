<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ava — Voice Contact Center</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #eef1f6;
    --surface: #ffffff;
    --surface-alt: #f3f5f9;
    --border: #e1e4eb;
    --text: #12141a;
    --text-muted: #6b7080;
    --text-faint: #9198a8;
    --accent: #2454e0;
    --accent-hover: #1c44c2;
    --accent-soft: #2454e014;
    --ring: #2454e033;
    --danger: #dc2626;
    --danger-hover: #b91c1c;
    --success: #16a34a;
    --warning: #b45309;
    --header-bg: #12162a;
    --header-text: #f4f6fb;
    --header-text-muted: #9aa3c0;
    --shadow: 0 1px 2px rgba(15, 18, 30, 0.04), 0 1px 12px rgba(15, 18, 30, 0.03);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0d13;
      --surface: #151822;
      --surface-alt: #1c202c;
      --border: #262b3a;
      --text: #edeff5;
      --text-muted: #9aa0b4;
      --text-faint: #6b7080;
      --accent: #3b6bff;
      --accent-hover: #5a82ff;
      --accent-soft: #3b6bff1f;
      --ring: #3b6bff4d;
      --header-bg: #0b0d16;
      --header-text: #f4f6fb;
      --header-text-muted: #7d84a0;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 1px 12px rgba(0,0,0,0.25);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- header ---------- */
  header.topbar {
    background: var(--header-bg);
    color: var(--header-text);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(135deg, #3b6bff, #8b5cf6);
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 700; font-size: 15px;
    flex-shrink: 0;
  }
  .brand-text { display: flex; flex-direction: column; line-height: 1.25; }
  .brand-text strong { font-size: 14.5px; font-weight: 600; }
  .brand-text span { font-size: 12px; color: var(--header-text-muted); }
  .env-badge {
    margin-left: auto;
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600; color: var(--header-text-muted);
    border: 1px solid #ffffff22; padding: 5px 10px; border-radius: 999px;
  }
  .env-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); }

  /* ---------- layout ---------- */
  main.shell {
    max-width: 1040px;
    margin: 0 auto;
    padding: 28px 24px 48px;
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 20px;
    align-items: start;
  }
  @media (max-width: 800px) {
    main.shell { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
  }
  .panel-pad { padding: 20px; }

  /* ---------- form fields ---------- */
  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .field { margin-bottom: 16px; }
  .field:last-child { margin-bottom: 0; }
  input[type="text"], input[type="tel"] {
    width: 100%;
    padding: 10px 12px;
    font-size: 14px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--surface-alt);
    color: inherit;
    font-family: inherit;
    transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
  }
  input[type="text"]:focus, input[type="tel"]:focus {
    outline: none;
    border-color: var(--accent);
    background: var(--surface);
    box-shadow: 0 0 0 3px var(--ring);
  }
  input.invalid { border-color: var(--danger); }
  .hint { font-size: 12px; color: var(--text-faint); margin: 6px 2px 0; }
  .hint.error { color: var(--danger); }

  details.advanced { margin-top: 18px; border-top: 1px solid var(--border); padding-top: 14px; }
  details.advanced summary {
    font-size: 12.5px; font-weight: 600; color: var(--text-muted); cursor: pointer;
    user-select: none; list-style: none; display: flex; align-items: center; gap: 4px;
  }
  details.advanced summary::-webkit-details-marker { display: none; }
  details.advanced summary::before { content: '▸'; font-size: 10px; }
  details.advanced[open] summary::before { content: '▾'; }
  details.advanced .field { margin-top: 14px; }

  /* ---------- call panel ---------- */
  .call-status-row {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin: 18px 0 20px;
  }
  .status {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600; padding: 5px 10px 5px 8px;
    border-radius: 999px;
  }
  .status::before {
    content: ''; width: 7px; height: 7px; border-radius: 50%;
    background: currentColor;
  }
  .status.disconnected { background: #8888881a; color: var(--text-faint); }
  .status.connecting { background: #f59e0b26; color: var(--warning); }
  .status.connected { background: #16a34a26; color: var(--success); }
  .status.connected::before { animation: pulse 1.4s ease-in-out infinite; }
  .status.error { background: #dc262626; color: var(--danger); }
  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 currentColor; }
    50% { opacity: 0.55; }
  }

  .call-timer {
    font-variant-numeric: tabular-nums;
    font-size: 13px; font-weight: 600; color: var(--text-muted);
  }

  .call-buttons {
    display: flex; justify-content: center; align-items: center; gap: 22px;
    margin-bottom: 10px;
  }
  .call-btn {
    width: 60px; height: 60px; border-radius: 50%;
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, transform 0.05s, box-shadow 0.15s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
  }
  .call-btn svg { width: 24px; height: 24px; }
  .call-btn:active:not(:disabled) { transform: scale(0.94); }
  .call-btn:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; }
  .call-btn--start { background: var(--success); color: white; }
  .call-btn--start:hover:not(:disabled) { background: #128a3e; }
  .call-btn--stop { background: var(--danger); color: white; }
  .call-btn--stop:hover:not(:disabled) { background: var(--danger-hover); }

  .call-btn-labels {
    display: flex; justify-content: center; gap: 22px;
    font-size: 12px; color: var(--text-faint); font-weight: 600;
    margin-bottom: 4px;
  }
  .call-btn-labels span { width: 60px; text-align: center; }

  /* ---------- transcript ---------- */
  .transcript-panel { display: flex; flex-direction: column; height: 560px; }
  .transcript-header {
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
    flex-shrink: 0;
  }
  .transcript-header .title { font-size: 13.5px; font-weight: 600; }
  .transcript-header .sub { font-size: 12px; color: var(--text-faint); margin-left: auto; }
  #transcript {
    padding: 20px;
    flex: 1;
    /* min-height: 0 overrides flex items' default min-height: auto, which
       otherwise lets this grow to fit all messages instead of clipping to
       the panel's fixed height and scrolling internally. */
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }
  #transcript:empty::after {
    content: 'Start a call and your conversation with Ava will appear here.';
    color: var(--text-faint); font-size: 13.5px;
    margin: auto;
    text-align: center;
    max-width: 260px;
  }

  .msg { display: flex; align-items: flex-end; gap: 8px; margin-bottom: 14px; max-width: 100%; }
  .msg.user { flex-direction: row-reverse; margin-left: auto; }
  .msg.assistant { margin-right: auto; }
  .msg .avatar {
    width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700;
  }
  .msg.assistant .avatar { background: linear-gradient(135deg, #3b6bff, #8b5cf6); color: #fff; }
  .msg.user .avatar { background: var(--border); color: var(--text-muted); }
  .msg .bubble {
    max-width: 380px;
    padding: 9px 13px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.45;
    word-wrap: break-word;
  }
  .msg.assistant .bubble { background: var(--surface-alt); border-bottom-left-radius: 4px; }
  .msg.user .bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }

  .msg.system { justify-content: center; margin: 6px 0 14px; }
  .msg.system .bubble {
    background: var(--surface-alt); color: var(--text-faint);
    font-size: 11.5px; font-weight: 600; padding: 4px 12px; border-radius: 999px;
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand-mark">A</div>
  <div class="brand-text">
    <strong>Ava</strong>
    <span>AI Voice Contact Center</span>
  </div>
  <div class="env-badge"><span class="dot"></span>AI Agent</div>
</header>

<main class="shell">
  <div class="panel panel-pad">
    <div class="field">
      <label for="mobileNumber">Caller mobile number</label>
      <input id="mobileNumber" type="tel" inputmode="tel" autocomplete="tel"
        placeholder="e.g. +91 98765 43210">
      <p id="mobileHint" class="hint">Used to look up your policy — no need to say it out loud.</p>
    </div>

    <div class="call-status-row">
      <span id="status" class="status disconnected">Not connected</span>
      <span id="callTimer" class="call-timer" hidden>00:00</span>
    </div>

    <div class="call-buttons">
      <button id="startBtn" class="call-btn call-btn--start" title="Talk to Ava" aria-label="Talk to Ava">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24 11.36 11.36 0 0 0 3.57.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1C10.61 21 3 13.39 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1 11.36 11.36 0 0 0 .57 3.57 1 1 0 0 1-.25 1.02l-2.2 2.2z"/></svg>
      </button>
      <button id="stopBtn" class="call-btn call-btn--stop" disabled title="End Call" aria-label="End Call">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 8c-2.4 0-4.7.38-6.87 1.08a1.6 1.6 0 0 0-1.1 1.71l.36 2.94a1.6 1.6 0 0 0 1.2 1.36c.79.2 1.5.48 2.16.81a1.6 1.6 0 0 0 1.74-.24l1.44-1.27a13 13 0 0 1 2.14 0l1.44 1.27a1.6 1.6 0 0 0 1.74.24c.66-.33 1.37-.6 2.16-.81a1.6 1.6 0 0 0 1.2-1.36l.36-2.94a1.6 1.6 0 0 0-1.1-1.71A22.7 22.7 0 0 0 12 8z"/></svg>
      </button>
    </div>
    <div class="call-btn-labels">
      <span>Talk</span>
      <span>End</span>
    </div>

    <details class="advanced">
      <summary>Connection settings</summary>
      <div class="field">
        <label for="presignEndpoint">Presigned-URL endpoint</label>
        <input id="presignEndpoint" type="text"
          placeholder="Function URL, API Gateway URL, or ws://127.0.0.1:8080/ws for local testing">
      </div>
    </details>
  </div>

  <div class="panel transcript-panel">
    <div class="transcript-header">
      <span class="title">Live Transcript</span>
      <span class="sub">Real-time speech-to-text</span>
    </div>
    <div id="transcript"></div>
  </div>
</main>

<script>
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const statusEl = document.getElementById('status');
const callTimerEl = document.getElementById('callTimer');
const transcriptEl = document.getElementById('transcript');
const endpointInput = document.getElementById('presignEndpoint');
const mobileInput = document.getElementById('mobileNumber');
const mobileHint = document.getElementById('mobileHint');

const MOBILE_HINT_DEFAULT = mobileHint.textContent;
const MOBILE_PATTERN = /^\+?[\d\-\s]{7,20}$/;

endpointInput.value = localStorage.getItem('ava_presign_endpoint') || '';
mobileInput.value = localStorage.getItem('ava_mobile_number') || '';

function validateMobile() {
  const value = mobileInput.value.trim();
  if (!value) {
    mobileInput.classList.remove('invalid');
    mobileHint.textContent = MOBILE_HINT_DEFAULT;
    mobileHint.classList.remove('error');
    return null;
  }
  if (!MOBILE_PATTERN.test(value)) {
    mobileInput.classList.add('invalid');
    mobileHint.textContent = 'Enter a valid mobile number (digits only, optionally starting with +).';
    mobileHint.classList.add('error');
    return false;
  }
  mobileInput.classList.remove('invalid');
  mobileHint.textContent = MOBILE_HINT_DEFAULT;
  mobileHint.classList.remove('error');
  return value;
}

mobileInput.addEventListener('input', validateMobile);

let syncHintTimeout = null;

function syncMobileNumber(value) {
  mobileInput.value = value;
  localStorage.setItem('ava_mobile_number', value);
  validateMobile();

  mobileHint.textContent = 'Updated from the call — Ava confirmed a different number.';
  mobileHint.classList.remove('error');
  if (syncHintTimeout) clearTimeout(syncHintTimeout);
  syncHintTimeout = setTimeout(() => {
    mobileHint.textContent = MOBILE_HINT_DEFAULT;
    syncHintTimeout = null;
  }, 4000);
}

let ws = null;
let audioCtx = null;
let micStream = null;
let micNode = null;
let workletNode = null;
let nextPlaybackTime = 0;
let scheduledSources = [];
let micBuffer = [];
const MIC_CHUNK_SAMPLES = 1600; // ~100ms at 16kHz before sending over the wire

let callTimerInterval = null;
let callStartedAt = 0;

function startCallTimer() {
  callStartedAt = Date.now();
  callTimerEl.hidden = false;
  callTimerEl.textContent = '00:00';
  callTimerInterval = setInterval(() => {
    const elapsed = Math.floor((Date.now() - callStartedAt) / 1000);
    const mm = String(Math.floor(elapsed / 60)).padStart(2, '0');
    const ss = String(elapsed % 60).padStart(2, '0');
    callTimerEl.textContent = `${mm}:${ss}`;
  }, 1000);
}

function stopCallTimer() {
  if (callTimerInterval) clearInterval(callTimerInterval);
  callTimerInterval = null;
  callTimerEl.hidden = true;
}

function setStatus(state, text) {
  statusEl.className = `status ${state}`;
  statusEl.textContent = text || state;
}

function addSystemLine(text) {
  const div = document.createElement('div');
  div.className = 'msg system';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  div.appendChild(bubble);
  transcriptEl.appendChild(div);
  transcriptEl.scrollTop = transcriptEl.scrollHeight;
}

function makeMessageRow(role) {
  const row = document.createElement('div');
  row.className = `msg ${role}`;
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  if (role === 'user') {
    avatar.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M12 12a4.8 4.8 0 1 0 0-9.6 4.8 4.8 0 0 0 0 9.6zm0 2.4c-4.4 0-8.4 2.24-8.4 5.4v.6c0 .66.54 1.2 1.2 1.2h14.4c.66 0 1.2-.54 1.2-1.2v-.6c0-3.16-4-5.4-8.4-5.4z"/></svg>';
  } else {
    avatar.textContent = 'A';
  }
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  row.appendChild(avatar);
  row.appendChild(bubble);
  transcriptEl.appendChild(row);
  return bubble;
}

// bidi_transcript_stream fires once per incremental delta, not once per
// finished sentence — this tracks one in-progress bubble per role and
// overwrites its text as deltas arrive, instead of appending a new bubble
// for every fragment. is_final closes the bubble out so the next utterance
// from that role starts a fresh one.
const activeStreamBubbles = { user: null, assistant: null };

function upsertStreamLine(role, text, isFinal) {
  let bubble = activeStreamBubbles[role];
  if (!bubble) {
    bubble = makeMessageRow(role);
    activeStreamBubbles[role] = bubble;
  }
  bubble.textContent = text;
  transcriptEl.scrollTop = transcriptEl.scrollHeight;
  if (isFinal) {
    activeStreamBubbles[role] = null;
  }
}

// --- base64 <-> PCM16 helpers ---

function floatTo16BitPCM(float32) {
  const out = new Int16Array(float32.length);
  for (let i = 0; i < float32.length; i++) {
    const s = Math.max(-1, Math.min(1, float32[i]));
    out[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
  }
  return out;
}

function int16ToBase64(int16) {
  const bytes = new Uint8Array(int16.buffer);
  let binary = '';
  const chunkSize = 0x8000;
  for (let i = 0; i < bytes.length; i += chunkSize) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
  }
  return btoa(binary);
}

function base64ToFloat32(base64) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  const int16 = new Int16Array(bytes.buffer);
  const float32 = new Float32Array(int16.length);
  for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 0x8000;
  return float32;
}

// --- playback (sequential queue, no overlap) ---

function playAudioChunk(base64, sampleRate) {
  const float32 = base64ToFloat32(base64);
  const buffer = audioCtx.createBuffer(1, float32.length, sampleRate);
  buffer.copyToChannel(float32, 0);

  const source = audioCtx.createBufferSource();
  source.buffer = buffer;
  source.connect(audioCtx.destination);

  const now = audioCtx.currentTime;
  const startAt = Math.max(now, nextPlaybackTime);
  source.start(startAt);
  nextPlaybackTime = startAt + buffer.duration;

  scheduledSources.push(source);
  source.onended = () => {
    scheduledSources = scheduledSources.filter((s) => s !== source);
  };
}

function stopPlayback() {
  // Barge-in: stop every scheduled/playing chunk immediately. Just resetting
  // nextPlaybackTime (the old approach) doesn't un-schedule anything already
  // playing, so Ava's stale audio kept playing underneath whatever came next.
  for (const source of scheduledSources) {
    try {
      source.stop();
    } catch (err) {
      // already finished playing on its own
    }
  }
  scheduledSources = [];
  nextPlaybackTime = audioCtx.currentTime;
}

// --- mic capture via AudioWorklet ---

const WORKLET_SOURCE = `
  class MicCaptureProcessor extends AudioWorkletProcessor {
    process(inputs) {
      const input = inputs[0];
      if (input && input[0]) {
        this.port.postMessage(input[0].slice());
      }
      return true;
    }
  }
  registerProcessor('mic-capture-processor', MicCaptureProcessor);
`;

async function startMic() {
  micStream = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, sampleRate: 16000, echoCancellation: true, noiseSuppression: true },
  });

  audioCtx = new AudioContext({ sampleRate: 16000 });
  nextPlaybackTime = audioCtx.currentTime;

  const workletBlobUrl = URL.createObjectURL(new Blob([WORKLET_SOURCE], { type: 'application/javascript' }));
  await audioCtx.audioWorklet.addModule(workletBlobUrl);

  micNode = audioCtx.createMediaStreamSource(micStream);
  workletNode = new AudioWorkletNode(audioCtx, 'mic-capture-processor');

  workletNode.port.onmessage = (event) => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    micBuffer.push(event.data);
    const total = micBuffer.reduce((n, c) => n + c.length, 0);
    if (total < MIC_CHUNK_SAMPLES) return;

    const merged = new Float32Array(total);
    let offset = 0;
    for (const chunk of micBuffer) { merged.set(chunk, offset); offset += chunk.length; }
    micBuffer = [];

    const pcm16 = floatTo16BitPCM(merged);
    ws.send(JSON.stringify({
      type: 'bidi_audio_input',
      audio: int16ToBase64(pcm16),
      format: 'pcm',
      sample_rate: 16000,
      channels: 1,
    }));
  };

  micNode.connect(workletNode);
}

function stopMic() {
  if (micStream) micStream.getTracks().forEach((t) => t.stop());
  if (workletNode) workletNode.disconnect();
  if (micNode) micNode.disconnect();
  micStream = micNode = workletNode = null;
}

// --- connection lifecycle ---

async function start() {
  const endpoint = endpointInput.value.trim();
  if (!endpoint) {
    alert('Enter your presigned-URL Lambda endpoint first (see Connection settings).');
    return;
  }
  const mobileValidation = validateMobile();
  if (mobileValidation === false) {
    mobileInput.focus();
    return;
  }
  const mobileNumber = mobileValidation || null;

  localStorage.setItem('ava_presign_endpoint', endpoint);
  if (mobileNumber) {
    localStorage.setItem('ava_mobile_number', mobileNumber);
  } else {
    localStorage.removeItem('ava_mobile_number');
  }

  startBtn.disabled = true;
  setStatus('connecting', 'Connecting…');

  try {
    // A ws://ish endpoint (local strands_agent.py, no deploy) is a
    // WebSocket URL already — fetch() can't request that scheme at all, so
    // skip the presign round trip and connect straight to it. Anything
    // else is treated as the presign Lambda's HTTP(S) endpoint, as before.
    let url;
    if (/^wss?:\/\//i.test(endpoint)) {
      url = endpoint;
    } else {
      const res = await fetch(endpoint);
      if (!res.ok) throw new Error(`Presign request failed: ${res.status}`);
      ({ url } = await res.json());
    }

    ws = new WebSocket(url);

    ws.onopen = async () => {
      setStatus('connected', 'On call');
      startCallTimer();
      // Sent before anything else so the backend can use it to skip asking
      // for the mobile number verbally — see agentcore_app/strands_agent.py.
      if (mobileNumber) {
        ws.send(JSON.stringify({ type: 'bidi_call_metadata', mobile_number: mobileNumber }));
      }
      addSystemLine('Connected. Speak into your microphone.');
      stopBtn.disabled = false;
      await startMic();
    };

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);

      if (data.type === 'bidi_audio_stream' && data.audio) {
        playAudioChunk(data.audio, data.sample_rate || 16000);
      }
      if (data.type === 'bidi_transcript_stream' && (data.text || data.current_transcript)) {
        const role = data.role === 'user' ? 'user' : 'assistant';
        const text = data.current_transcript ?? data.text;
        // The backend primes Ava to speak first with a synthetic "begin now"
        // line framed as the caller (see strands_agent.py) — it's plumbing,
        // not something the caller actually said, so don't show it.
        if (role === 'user' && text.includes('the call has just connected')) {
          return;
        }
        upsertStreamLine(role, text, !!data.is_final);
      }
      if (data.type === 'bidi_interruption') {
        stopPlayback();
      }
      if (data.type === 'bidi_call_metadata_update' && data.mobile_number) {
        // Ava confirmed a different number than what the UI pre-filled —
        // e.g. the caller corrected a wrong one mid-call (see the "Phone
        // numbers" business rule in strands_agent.py). Keep the field and
        // localStorage in sync so the caller doesn't have to also go back
        // and retype it after the call.
        syncMobileNumber(data.mobile_number);
      }
    };

    ws.onerror = () => {
      setStatus('error', 'Connection error');
      addSystemLine('WebSocket error — see browser console.');
    };

    ws.onclose = () => {
      setStatus('disconnected', 'Not connected');
      stopCallTimer();
      addSystemLine('Call ended.');
      startBtn.disabled = false;
      stopBtn.disabled = true;
      stopMic();
    };
  } catch (err) {
    console.error(err);
    setStatus('error', 'Failed to connect');
    addSystemLine(`Failed to connect: ${err.message}`);
    startBtn.disabled = false;
  }
}

function stop() {
  if (ws) ws.close();
}

startBtn.addEventListener('click', start);
stopBtn.addEventListener('click', stop);
</script>
</body>
</html>
