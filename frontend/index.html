<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ava — Voice Contact Center</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 640px;
    margin: 48px auto;
    padding: 0 20px;
    line-height: 1.5;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .subtitle { color: #888; margin-bottom: 24px; font-size: 14px; }
  .config {
    display: flex; gap: 8px; margin-bottom: 20px;
  }
  .config input {
    flex: 1; padding: 8px 10px; font-size: 13px;
    border: 1px solid #999; border-radius: 6px;
    background: transparent; color: inherit;
  }
  .controls { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  button {
    padding: 10px 20px; font-size: 14px; border-radius: 8px;
    border: none; cursor: pointer; font-weight: 600;
  }
  button.start { background: #2563eb; color: white; }
  button.stop { background: #dc2626; color: white; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .status { font-size: 13px; padding: 4px 10px; border-radius: 12px; }
  .status.disconnected { background: #4443; color: #999; }
  .status.connecting { background: #f59e0b33; color: #b45309; }
  .status.connected { background: #16a34a33; color: #15803d; }
  .status.error { background: #dc262633; color: #b91c1c; }
  #transcript {
    border: 1px solid #4444; border-radius: 8px; padding: 16px;
    height: 340px; overflow-y: auto; font-size: 14px;
  }
  .line { margin-bottom: 10px; }
  .line .who { font-weight: 600; margin-right: 6px; }
  .line.user .who { color: #2563eb; }
  .line.assistant .who { color: #15803d; }
  .line.system { color: #888; font-style: italic; font-size: 13px; }
</style>
</head>
<body>

<h1>Ava — Voice Contact Center</h1>
<p class="subtitle">Talk to Ava about your policy, register a claim, or ask for a human agent.</p>

<div class="config">
  <input id="presignEndpoint" type="text"
    placeholder="Presigned-URL Lambda endpoint (Function URL or API Gateway URL)">
</div>

<div class="controls">
  <button id="startBtn" class="start">Talk to Ava</button>
  <button id="stopBtn" class="stop" disabled>End Call</button>
  <span id="status" class="status disconnected">disconnected</span>
</div>

<div id="transcript"></div>

<script>
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const statusEl = document.getElementById('status');
const transcriptEl = document.getElementById('transcript');
const endpointInput = document.getElementById('presignEndpoint');

endpointInput.value = localStorage.getItem('ava_presign_endpoint') || '';

let ws = null;
let audioCtx = null;
let micStream = null;
let micNode = null;
let workletNode = null;
let nextPlaybackTime = 0;
let scheduledSources = [];
let micBuffer = [];
const MIC_CHUNK_SAMPLES = 1600; // ~100ms at 16kHz before sending over the wire

function setStatus(state, text) {
  statusEl.className = `status ${state}`;
  statusEl.textContent = text || state;
}

function addLine(who, text) {
  const div = document.createElement('div');
  div.className = `line ${who}`;
  if (who === 'system') {
    div.textContent = text;
  } else {
    const label = document.createElement('span');
    label.className = 'who';
    label.textContent = who === 'user' ? 'You:' : 'Ava:';
    div.appendChild(label);
    div.appendChild(document.createTextNode(text));
  }
  transcriptEl.appendChild(div);
  transcriptEl.scrollTop = transcriptEl.scrollHeight;
}

// bidi_transcript_stream fires once per incremental delta, not once per
// finished sentence — this tracks one in-progress <div> per role and
// overwrites its text as deltas arrive, instead of appending a new line for
// every fragment. is_final closes the line out so the next utterance from
// that role starts a fresh one.
const activeStreamLines = { user: null, assistant: null };

function upsertStreamLine(role, text, isFinal) {
  let entry = activeStreamLines[role];
  if (!entry) {
    const div = document.createElement('div');
    div.className = `line ${role}`;
    const label = document.createElement('span');
    label.className = 'who';
    label.textContent = role === 'user' ? 'You:' : 'Ava:';
    div.appendChild(label);
    const textNode = document.createTextNode('');
    div.appendChild(textNode);
    transcriptEl.appendChild(div);
    entry = { div, textNode };
    activeStreamLines[role] = entry;
  }
  entry.textNode.textContent = text;
  transcriptEl.scrollTop = transcriptEl.scrollHeight;
  if (isFinal) {
    activeStreamLines[role] = null;
  }
}

// --- base64 <-> PCM16 helpers ---

function floatTo16BitPCM(float32) {
  const out = new Int16Array(float32.length);
  for (let i = 0; i < float32.length; i++) {
    const s = Math.max(-1, Math.min(1, float32[i]));
    out[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
  }
  return out;
}

function int16ToBase64(int16) {
  const bytes = new Uint8Array(int16.buffer);
  let binary = '';
  const chunkSize = 0x8000;
  for (let i = 0; i < bytes.length; i += chunkSize) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
  }
  return btoa(binary);
}

function base64ToFloat32(base64) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  const int16 = new Int16Array(bytes.buffer);
  const float32 = new Float32Array(int16.length);
  for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 0x8000;
  return float32;
}

// --- playback (sequential queue, no overlap) ---

function playAudioChunk(base64, sampleRate) {
  const float32 = base64ToFloat32(base64);
  const buffer = audioCtx.createBuffer(1, float32.length, sampleRate);
  buffer.copyToChannel(float32, 0);

  const source = audioCtx.createBufferSource();
  source.buffer = buffer;
  source.connect(audioCtx.destination);

  const now = audioCtx.currentTime;
  const startAt = Math.max(now, nextPlaybackTime);
  source.start(startAt);
  nextPlaybackTime = startAt + buffer.duration;

  scheduledSources.push(source);
  source.onended = () => {
    scheduledSources = scheduledSources.filter((s) => s !== source);
  };
}

function stopPlayback() {
  // Barge-in: stop every scheduled/playing chunk immediately. Just resetting
  // nextPlaybackTime (the old approach) doesn't un-schedule anything already
  // playing, so Ava's stale audio kept playing underneath whatever came next.
  for (const source of scheduledSources) {
    try {
      source.stop();
    } catch (err) {
      // already finished playing on its own
    }
  }
  scheduledSources = [];
  nextPlaybackTime = audioCtx.currentTime;
}

// --- mic capture via AudioWorklet ---

const WORKLET_SOURCE = `
  class MicCaptureProcessor extends AudioWorkletProcessor {
    process(inputs) {
      const input = inputs[0];
      if (input && input[0]) {
        this.port.postMessage(input[0].slice());
      }
      return true;
    }
  }
  registerProcessor('mic-capture-processor', MicCaptureProcessor);
`;

async function startMic() {
  micStream = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, sampleRate: 16000, echoCancellation: true, noiseSuppression: true },
  });

  audioCtx = new AudioContext({ sampleRate: 16000 });
  nextPlaybackTime = audioCtx.currentTime;

  const workletBlobUrl = URL.createObjectURL(new Blob([WORKLET_SOURCE], { type: 'application/javascript' }));
  await audioCtx.audioWorklet.addModule(workletBlobUrl);

  micNode = audioCtx.createMediaStreamSource(micStream);
  workletNode = new AudioWorkletNode(audioCtx, 'mic-capture-processor');

  workletNode.port.onmessage = (event) => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    micBuffer.push(event.data);
    const total = micBuffer.reduce((n, c) => n + c.length, 0);
    if (total < MIC_CHUNK_SAMPLES) return;

    const merged = new Float32Array(total);
    let offset = 0;
    for (const chunk of micBuffer) { merged.set(chunk, offset); offset += chunk.length; }
    micBuffer = [];

    const pcm16 = floatTo16BitPCM(merged);
    ws.send(JSON.stringify({
      type: 'bidi_audio_input',
      audio: int16ToBase64(pcm16),
      format: 'pcm',
      sample_rate: 16000,
      channels: 1,
    }));
  };

  micNode.connect(workletNode);
}

function stopMic() {
  if (micStream) micStream.getTracks().forEach((t) => t.stop());
  if (workletNode) workletNode.disconnect();
  if (micNode) micNode.disconnect();
  micStream = micNode = workletNode = null;
}

// --- connection lifecycle ---

async function start() {
  const endpoint = endpointInput.value.trim();
  if (!endpoint) {
    alert('Enter your presigned-URL Lambda endpoint first.');
    return;
  }
  localStorage.setItem('ava_presign_endpoint', endpoint);

  startBtn.disabled = true;
  setStatus('connecting', 'getting presigned url…');

  try {
    const res = await fetch(endpoint);
    if (!res.ok) throw new Error(`Presign request failed: ${res.status}`);
    const { url } = await res.json();

    setStatus('connecting', 'connecting…');
    ws = new WebSocket(url);

    ws.onopen = async () => {
      setStatus('connected', 'connected');
      addLine('system', 'Connected. Speak into your microphone.');
      stopBtn.disabled = false;
      await startMic();
    };

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);

      if (data.type === 'bidi_audio_stream' && data.audio) {
        playAudioChunk(data.audio, data.sample_rate || 16000);
      }
      if (data.type === 'bidi_transcript_stream' && (data.text || data.current_transcript)) {
        const role = data.role === 'user' ? 'user' : 'assistant';
        const text = data.current_transcript ?? data.text;
        // The backend primes Ava to speak first with a synthetic "begin now"
        // line framed as the caller (see strands_agent.py) — it's plumbing,
        // not something the caller actually said, so don't show it.
        if (role === 'user' && text.includes('the call has just connected')) {
          return;
        }
        upsertStreamLine(role, text, !!data.is_final);
      }
      if (data.type === 'bidi_interruption') {
        stopPlayback();
      }
    };

    ws.onerror = () => {
      setStatus('error', 'connection error');
      addLine('system', 'WebSocket error — see browser console.');
    };

    ws.onclose = () => {
      setStatus('disconnected', 'disconnected');
      addLine('system', 'Call ended.');
      startBtn.disabled = false;
      stopBtn.disabled = true;
      stopMic();
    };
  } catch (err) {
    console.error(err);
    setStatus('error', 'failed to connect');
    addLine('system', `Failed to connect: ${err.message}`);
    startBtn.disabled = false;
  }
}

function stop() {
  if (ws) ws.close();
}

startBtn.addEventListener('click', start);
stopBtn.addEventListener('click', stop);
</script>
</body>
</html>
